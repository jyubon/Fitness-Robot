<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; font-weight: 300; }

    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 8px;
    }

    .status.disconnected { background: #ff4444; }
    .status.connected    { background: #44ff44; color: black; }
    .status.connecting   { background: #ffaa00; color: black; }

    .connect-btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .connect-btn:active { transform: scale(0.98); }
    .connect-btn:disabled { opacity: 0.5; }

    .step-display {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .step-count { font-size: 72px; font-weight: 700; line-height: 1; }
    .step-label { font-size: 14px; opacity: 0.7; margin-top: 4px; }

    .progress-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #44ff44, #00cc00);
      border-radius: 4px;
      transition: width 0.5s ease;
      width: 0%;
    }

    .goal-text { font-size: 12px; opacity: 0.6; margin-top: 5px; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .stat-value { font-size: 24px; font-weight: 700; }
    .stat-label { font-size: 11px; opacity: 0.6; margin-top: 4px; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .action-btn {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .action-btn:active { background: rgba(255, 255, 255, 0.2); }

    .log {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      padding: 15px;
      font-family: monospace;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
    }

    .log-entry { margin-bottom: 4px; opacity: 0.8; }

    .history {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .history h3 { font-size: 16px; margin-bottom: 10px; }

    .history-entry {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🦶 Step Tracker</h1>
    <span class="status disconnected" id="statusBadge">Disconnected</span>
  </div>

  <button class="connect-btn" id="connectBtn" onclick="toggleConnection()">
    Connect to Tracker
  </button>

  <div class="step-display">
    <div class="step-count" id="stepCount">0</div>
    <div class="step-label">steps today</div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="goal-text" id="goalText">0% of 10,000 goal</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="calories">0</div>
      <div class="stat-label">calories</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="distance">0.00</div>
      <div class="stat-label">km</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="activeMin">0</div>
      <div class="stat-label">active min</div>
    </div>
  </div>

  <div class="actions">
    <button class="action-btn" onclick="syncTime()">⏰ Sync Time</button>
    <button class="action-btn" onclick="requestData()">📊 Get Data</button>
    <button class="action-btn" onclick="resetSteps()">🔄 Reset Steps</button>
    <button class="action-btn" onclick="exportData()">💾 Export</button>
  </div>

  <div class="history" id="historySection">
    <h3>📅 History</h3>
    <div id="historyList">
      <div class="history-entry"><span>No data yet</span></div>
    </div>
  </div>

  <div class="log" id="logContainer">
    <div class="log-entry">Ready to connect...</div>
  </div>

<script>
  // ==================== BLE CONFIG ====================
  const SERVICE_UUID    = '12345678-1234-1234-1234-123456789001';
  const STEP_COUNT_UUID = '12345678-1234-1234-1234-123456789002';
  const TIME_SYNC_UUID  = '12345678-1234-1234-1234-123456789003';
  const DAILY_DATA_UUID = '12345678-1234-1234-1234-123456789004';
  const COMMAND_UUID    = '12345678-1234-1234-1234-123456789005';

  let device = null;
  let server = null;
  let stepCountChar = null;
  let timeSyncChar  = null;
  let dailyDataChar = null;
  let commandChar   = null;
  let connected     = false;

  // ==================== STORAGE ====================
  const HISTORY_KEY = 'step_tracker_history';

  function getHistory() {
    const data = localStorage.getItem(HISTORY_KEY);
    return data ? JSON.parse(data) : [];
  }

  function saveToHistory(entry) {
    const history = getHistory();
    const today = new Date().toLocaleDateString();
    const existingIndex = history.findIndex(h => h.date === today);

    if (existingIndex >= 0) {
      history[existingIndex] = { ...entry, date: today };
    } else {
      history.unshift({ ...entry, date: today });
    }

    while (history.length > 30) history.pop();
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const history = getHistory();
    const container = document.getElementById('historyList');

    if (history.length === 0) {
      container.innerHTML = '<div class="history-entry"><span>No data yet</span></div>';
      return;
    }

    container.innerHTML = history.map(entry =>
      `<div class="history-entry">
        <span>${entry.date}</span>
        <span>${entry.steps || 0} steps</span>
        <span>${entry.km || '0.00'} km</span>
      </div>`
    ).join('');
  }

  // ==================== LOGGING ====================
  function log(msg) {
    const container = document.getElementById('logContainer');
    const time = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.textContent = `[${time}] ${msg}`;
    container.appendChild(entry);
    container.scrollTop = container.scrollHeight;

    while (container.children.length > 50) {
      container.removeChild(container.firstChild);
    }
  }

  // ==================== STATUS ====================
  function setStatus(status) {
    const badge = document.getElementById('statusBadge');
    const btn   = document.getElementById('connectBtn');

    badge.className = 'status ' + status;

    switch (status) {
      case 'connected':
        badge.textContent = 'Connected';
        btn.textContent   = 'Disconnect';
        btn.disabled      = false;
        break;
      case 'connecting':
        badge.textContent = 'Connecting...';
        btn.textContent   = 'Connecting...';
        btn.disabled      = true;
        break;
      case 'disconnected':
        badge.textContent = 'Disconnected';
        btn.textContent   = 'Connect to Tracker';
        btn.disabled      = false;
        break;
    }
  }

  // ==================== CONNECTION ====================
  async function toggleConnection() {
    if (connected) {
      disconnect();
    } else {
      await connect();
    }
  }

  async function connect() {
    try {
      setStatus('connecting');
      log('Opening device picker...');
      log('⚠️ Make sure nRF Connect is DISCONNECTED first!');

      try {
        log('Trying service UUID filter...');
        device = await navigator.bluetooth.requestDevice({
          filters: [
            { services: [SERVICE_UUID] }
          ],
          optionalServices: [SERVICE_UUID]
        });
      } catch (e1) {
        log('Service filter failed: ' + e1.message);
        log('Trying name filter...');

        try {
          device = await navigator.bluetooth.requestDevice({
            filters: [
              { name: 'StepTracker' },
              { namePrefix: 'Step' }
            ],
            optionalServices: [SERVICE_UUID]
          });
        } catch (e2) {
          log('Name filter failed: ' + e2.message);
          log('Showing ALL devices...');

          device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [SERVICE_UUID]
          });
        }
      }

      log('Selected: ' + (device.name || 'Unknown Device'));
      log('ID: ' + device.id);

      device.addEventListener('gattserverdisconnected', onDisconnected);

      log('Connecting to GATT server...');
      server = await device.gatt.connect();
      log('GATT connected ✓');

      log('Getting service...');
      const service = await server.getPrimaryService(SERVICE_UUID);
      log('Service found ✓');

      log('Getting characteristics...');
      stepCountChar = await service.getCharacteristic(STEP_COUNT_UUID);
      timeSyncChar  = await service.getCharacteristic(TIME_SYNC_UUID);
      dailyDataChar = await service.getCharacteristic(DAILY_DATA_UUID);
      commandChar   = await service.getCharacteristic(COMMAND_UUID);
      log('All characteristics found ✓');

      log('Subscribing to notifications...');
      await stepCountChar.startNotifications();
      stepCountChar.addEventListener('characteristicvaluechanged', onStepCountChanged);

      await dailyDataChar.startNotifications();
      dailyDataChar.addEventListener('characteristicvaluechanged', onDailyDataChanged);

      connected = true;
      setStatus('connected');
      log('✅ Connected successfully!');

      setTimeout(async () => {
        await syncTime();
        await new Promise(r => setTimeout(r, 500));
        await requestData();
      }, 500);

    } catch (error) {
      log('❌ Error: ' + error.message);
      setStatus('disconnected');
    }
  }

  function disconnect() {
    if (device && device.gatt.connected) {
      device.gatt.disconnect();
    }
    connected = false;
    setStatus('disconnected');
    log('Disconnected');
  }

  function onDisconnected() {
    connected = false;
    setStatus('disconnected');
    log('Device disconnected');
  }

  // ==================== DATA HANDLERS ====================
  function onStepCountChanged(event) {
    const decoder = new TextDecoder();
    const value   = decoder.decode(event.target.value);
    const steps   = parseInt(value) || 0;

    document.getElementById('stepCount').textContent = steps.toLocaleString();
    const pct = Math.min(100, Math.round((steps / 10000) * 100));
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('goalText').textContent = pct + '% of 10,000 goal';
  }

  function onDailyDataChanged(event) {
    const decoder = new TextDecoder();
    const value   = decoder.decode(event.target.value);

    log('Data: ' + value);

    try {
      const data = JSON.parse(value);

      document.getElementById('stepCount').textContent = (data.steps || 0).toLocaleString();
      document.getElementById('calories').textContent  = Math.round(data.cal || 0);
      document.getElementById('distance').textContent  = (data.km || 0).toFixed(2);
      document.getElementById('activeMin').textContent = data.min || 0;

      const pct = data.pct || 0;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('goalText').textContent =
        pct + '% of ' + (data.goal || 10000).toLocaleString() + ' goal';

      saveToHistory({
        steps: data.steps,
        cal:   data.cal,
        km:    data.km,
        min:   data.min,
        pct:   data.pct
      });

    } catch (e) {
      log('Parse error: ' + e.message);
    }
  }

  // ==================== ACTIONS ====================
  async function syncTime() {
    if (!connected || !timeSyncChar) {
      log('Not connected');
      return;
    }

    try {
      const now    = Math.floor(Date.now() / 1000);
      const buffer = new ArrayBuffer(4);
      const view   = new DataView(buffer);
      view.setUint32(0, now, true);

      await timeSyncChar.writeValue(buffer);
      log('⏰ Time synced: ' + new Date().toLocaleTimeString());
    } catch (error) {
      log('Time sync error: ' + error.message);
    }
  }

  async function requestData() {
    if (!connected || !commandChar) {
      log('Not connected');
      return;
    }

    try {
      const encoder = new TextEncoder();
      await commandChar.writeValue(encoder.encode('SYNC'));
      log('📊 Data requested');
    } catch (error) {
      log('Request error: ' + error.message);
    }
  }

  async function resetSteps() {
    if (!connected || !commandChar) {
      log('Not connected');
      return;
    }

    if (!confirm('Reset step count to 0?')) return;

    try {
      const encoder = new TextEncoder();
      await commandChar.writeValue(encoder.encode('RESET'));
      log('🔄 Steps reset command sent');
    } catch (error) {
      log('Reset error: ' + error.message);
    }
  }

  function exportData() {
    const history = getHistory();
    if (history.length === 0) {
      log('No data to export');
      return;
    }

    let csv = 'Date,Steps,Calories,Distance(km),ActiveMinutes\n';
    history.forEach(entry => {
      csv += `${entry.date},${entry.steps || 0},${entry.cal || 0},${entry.km || 0},${entry.min || 0}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'step_tracker_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    log('💾 Data exported as CSV');
  }

  // ==================== INIT ====================
  renderHistory();

  if (!navigator.bluetooth) {
    log('❌ Web Bluetooth NOT supported!');
    log('Use Chrome on Android or Bluefy on iPhone');
    document.getElementById('connectBtn').disabled = true;
  } else {
    log('✅ Web Bluetooth supported');
  }
</script>
</body>
</html>
